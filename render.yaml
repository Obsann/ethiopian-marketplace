# SuqET — Render Blueprint (Postgres + API only)
# Frontend (Next.js) deploys on Vercel — do not add a web service here.
# Dashboard: New → Blueprint → connect this repo → render.yaml
# After hostnames exist, set sync:false secrets (FRONTEND_URL = Vercel URL, etc.).

databases:
  - name: suqet-db
    plan: basic-256mb
    databaseName: suqet
    user: suqet

services:
  - type: web
    name: suqet-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: suqet-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Vercel production origin (no trailing slash). Required for CORS + cookie credentials.
      - key: FRONTEND_URL
        sync: false
      # Optional comma-separated extra origins (e.g. Vercel preview URLs).
      - key: CORS_ORIGINS
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false
      - key: CHAPA_CALLBACK_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Hackathon/demo without a verified mail domain. Set "true" on suqet-api (no domain needed):
      # signups can log in immediately; password reset email is unavailable. Turn off when
      # EMAIL_FROM is an address on a Resend-verified domain.
      - key: SKIP_EMAIL_VERIFICATION
        value: "true"
      # Prefer Resend on Render (SMTP outbound is often blocked). Optional until you have a domain.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Optional local/SMTP fallback — usually leave unset on Render.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      # Hackathon/demo: set "true" then redeploy so API boot upserts admin@marketplace.et and other seed users.
      # Listings are created only when the catalog is empty. Leave false after the demo if you do not want passwords reset on restart.
      - key: FORCE_SEED
        sync: false
